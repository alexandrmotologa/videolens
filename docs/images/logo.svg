<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="vl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="vl-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="vl-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Base Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#vl-bg)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" stroke="url(#vl-accent)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Outer Lens Ring (ABR Tracks) -->
  <circle cx="64" cy="64" r="44" stroke="#334155" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="64" cy="64" r="36" stroke="url(#vl-ring)" stroke-width="2.5"/>

  <!-- Aperture Blades -->
  <path d="M 64 28 L 76 52 L 52 52 Z" fill="#38bdf8" fill-opacity="0.25"/>
  <path d="M 95 46 L 78 67 L 66 46 Z" fill="#6366f1" fill-opacity="0.25"/>
  <path d="M 95 82 L 71 82 L 83 61 Z" fill="#818cf8" fill-opacity="0.25"/>
  <path d="M 64 100 L 52 76 L 76 76 Z" fill="#a855f7" fill-opacity="0.25"/>
  <path d="M 33 82 L 50 61 L 62 82 Z" fill="#c084fc" fill-opacity="0.25"/>
  <path d="M 33 46 L 57 46 L 45 67 Z" fill="#38bdf8" fill-opacity="0.25"/>

  <!-- Central Play Core -->
  <circle cx="64" cy="64" r="20" fill="#0f172a" stroke="url(#vl-accent)" stroke-width="2"/>
  <polygon points="59,54 75,64 59,74" fill="url(#vl-accent)"/>

  <!-- Diagnostic Tick Marks -->
  <line x1="64" y1="12" x2="64" y2="18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="110" x2="64" y2="116" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="64" x2="18" y2="64" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="110" y1="64" x2="116" y2="64" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
